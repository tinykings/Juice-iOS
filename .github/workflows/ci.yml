name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Juice/Core must stay Foundation-only so these run on Linux (AGENTS.md).
  core:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  # Catches app build errors before they reach a device.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild -project Juice.xcodeproj -scheme Juice
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
